# Blueprint для авторазвёртывания на Render (CD).
# Render создаёт веб-сервис и PostgreSQL-кластер, беря DATABASE_URL из связанной БД.
services:
  - type: web
    name: tplab2-electronics-shop
    runtime: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py loaddata products.yaml
    startCommand: gunicorn tplab2.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: electronics-shop-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.13

databases:
  - name: electronics-shop-db
    databaseName: django_db
    plan: free
